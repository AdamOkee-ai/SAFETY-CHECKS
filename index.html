<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14171B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Site Safety Checks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one narrow column built for a phone in a gloved hand — sticky brand bar, big tap targets, a fixed action bar at the bottom. */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --sunk:#F5F6F8; --ink:#14171B; --muted:#5A626C; --line:#D3D8DE;
  --brand:#E1100A; --info:#1F7FBE; --info-bg:#E4F1FA;
  --pass:#157A3A; --pass-bg:#E2F3E8; --fail:#C0281B; --fail-bg:#FBE4E1; --warn-bg:#FFF4D6; --warn:#7A5300;
  --btn:#14171B; --btn-ink:#FFFFFF;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1113; --surface:#191C20; --sunk:#14171A; --ink:#EEF1F4; --muted:#A0A8B2; --line:#2E343B;
  --brand:#FF4136; --info:#5DB3EA; --info-bg:#132634;
  --pass:#43C374; --pass-bg:#12301F; --fail:#FF6A5C; --fail-bg:#3A1612; --warn-bg:#33280E; --warn:#F2C766;
  --btn:#EEF1F4; --btn-ink:#14171B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1113; --surface:#191C20; --sunk:#14171A; --ink:#EEF1F4; --muted:#A0A8B2; --line:#2E343B;
  --brand:#FF4136; --info:#5DB3EA; --info-bg:#132634;
  --pass:#43C374; --pass-bg:#12301F; --fail:#FF6A5C; --fail-bg:#3A1612; --warn-bg:#33280E; --warn:#F2C766;
  --btn:#EEF1F4; --btn-ink:#14171B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.row,.hchk,.days,.tile,.langs,.grp{-webkit-user-select:none;user-select:none}
.row input,.hchk input{-webkit-user-select:text;user-select:text}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:8px;min-height:56px}
.top img{height:38px;width:auto;background:#fff;border-radius:6px;padding:2px}
.top .ttl{flex:1;min-width:0}
.top h1{font-family:var(--f-head);font-size:19px;line-height:1.05;margin:0;letter-spacing:.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.top .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--sunk);border-radius:8px;min-width:40px;height:40px;display:grid;place-items:center;padding:0 10px;font-weight:600}
.langs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0}
.langs button{border:0;background:transparent;padding:0 9px;height:38px;font-weight:600;font-size:13px;letter-spacing:.04em;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}

main.wrap{padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-head);font-size:22px;margin:0;line-height:1.15;text-wrap:balance}
h3{font-family:var(--f-head);font-size:18px;margin:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

/* Home tiles */
.tile{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;width:100%}
.tile .ico{width:52px;height:52px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;border:1px solid var(--line)}
.tile .ico svg{width:30px;height:30px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile strong{display:block;font-family:var(--f-head);font-size:20px;line-height:1.15}
.tile .chev{font-size:24px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);margin-top:6px}
.pill.on{background:var(--info-bg);color:var(--info);border-color:transparent}

/* Fields */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.fields{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field label .en{font-weight:400}
input[type=text],input[type=date],input[type=url],textarea{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:10px 12px;min-height:46px;font-size:16px}
textarea{min-height:90px;resize:vertical}
input.bad{border-color:var(--fail);background:var(--fail-bg)}

/* Day tabs */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topH,57px));z-index:5;background:var(--bg);padding-block:8px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.days b{font-size:14px;font-weight:700}
.days small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.days .bar{width:70%;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:3px}
.days .bar i{display:block;height:100%;background:var(--pass)}
.days .bar.f i{background:var(--fail)}
.days button[aria-pressed="true"]{background:var(--btn);border-color:var(--btn)}
.days button[aria-pressed="true"] b,.days button[aria-pressed="true"] small{color:var(--btn-ink)}

/* Checklist rows */
.sechead{display:flex;flex-direction:column;gap:4px}
.scan{background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:12px;font-size:14px}
.scan b{color:var(--warn)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.row{display:grid;grid-template-columns:30px 1fr 52px 44px;gap:10px;align-items:center;padding:12px 12px 12px 10px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .n{font-family:var(--f-head);font-weight:700;font-size:17px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;align-self:start;padding-top:1px}
.row .tx{min-width:0;font-size:15px}
.row .tx .en{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.tick{width:52px;height:52px;border-radius:10px;border:2px solid var(--muted);background:var(--surface);display:grid;place-items:center;padding:0}
.tick svg{width:30px;height:30px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tick[aria-checked="true"]{background:var(--pass);border-color:var(--pass)}
.tick[aria-checked="true"] svg{opacity:1}
.x{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:0}
.x[aria-pressed="true"]{background:var(--fail);border-color:var(--fail);color:#fff}
.row.is-f{background:var(--fail-bg)}
.row .note{grid-column:2 / -1}
.row .note input{background:var(--surface);border-color:var(--fail)}
.howto{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.alert{border-radius:8px;padding:12px 14px;font-weight:600;font-size:14px;background:var(--fail-bg);color:var(--fail);border:1px solid var(--fail)}
.progress{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Signatures */
.signs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:620px){.signs{grid-template-columns:1fr}}
.sig{display:flex;flex-direction:column;gap:6px}
.pad{position:relative;border:1.5px dashed var(--muted);border-radius:8px;background:#FFFFFF;height:140px;touch-action:none}
.pad canvas{width:100%;height:100%;display:block;border-radius:8px}
.pad span{position:absolute;inset:auto 0 10px;text-align:center;color:#8A929B;font-size:13px;pointer-events:none}
.pad .clr{position:absolute;top:6px;right:6px;background:#F1F2F4;color:#14171B;border:1px solid #D3D8DE;border-radius:6px;font-size:13px;padding:4px 10px}

/* Harness cards */
.hcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:12px}
.hcard.is-f{border-color:var(--fail);box-shadow:inset 4px 0 0 var(--fail)}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:420px){.hgrid{grid-template-columns:1fr}}
.hchk{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 10px;background:var(--sunk);min-width:0}
.hchk.is-f{background:var(--fail-bg);border-color:var(--fail)}
.hchk .lbl{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.2}
.hchk .lbl small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.hchk .tick{width:44px;height:44px}
.hchk .tick svg{width:24px;height:24px}
.hchk .x{width:36px;height:36px;font-size:16px}
.grp{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.linkbtn{background:none;border:0;color:var(--fail);font-weight:600;padding:6px}
.ghost{border:1.5px solid var(--ink);background:transparent;border-radius:10px;min-height:50px;font-weight:700;font-size:16px;padding:0 16px}
.ghost.dashed{border-style:dashed;border-color:var(--muted);color:var(--ink)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}

/* Bottom bar */
.bar-bottom{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px}
.bar-bottom .wrap{display:flex;gap:10px;align-items:center}
.primary{flex:1;background:var(--btn);color:var(--btn-ink);border:0;border-radius:10px;min-height:52px;font-weight:700;font-size:17px;padding:0 16px}
.primary:disabled{opacity:.5}
.saved{font-size:12px;color:var(--muted);white-space:nowrap}
.saved:empty{display:none}
.saved{flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.primary{white-space:nowrap}

/* Sheet / dialog */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.sheet .acts{display:flex;flex-direction:column;gap:8px}
.sheet .primary{flex:none;width:100%}
.sheet .ghost{width:100%}
.ok{background:var(--pass-bg);color:var(--pass);border-radius:8px;padding:12px;font-weight:600}
.info{background:var(--info-bg);border-radius:8px;padding:12px;font-size:14px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
details.setup{font-size:14px}
details.setup summary{font-weight:700;cursor:pointer;padding:6px 0}
details.setup ol{padding-left:20px;display:flex;flex-direction:column;gap:6px}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
pre{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre}
.foot{font-size:12px;color:var(--muted);text-align:center}

/* ---- daily report, pickers, tracker, site list ---- */
.pick{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:46px;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 12px;text-align:left;font-weight:600}
.pick span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pick.empty{color:var(--muted);font-weight:400;border-style:dashed}
.pick b{color:var(--muted);font-size:20px}
.bad,.pick.bad,.row.bad,.hchk.bad,.pad.bad,input.bad,textarea.bad{outline:2.5px solid var(--fail);outline-offset:-1px;background-color:var(--fail-bg)}
.row.bad .tick{border-color:var(--fail)}
.saved b{color:var(--fail);font-size:15px}
.saved .okdot{color:var(--pass);font-weight:700}
.primary.dim{opacity:.55}
.pill.warn{background:var(--fail-bg);color:var(--fail);border-color:transparent}
.acct{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;min-height:40px}
.linkbtn.plain{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--btn);color:var(--btn-ink);padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600;max-width:min(92vw,520px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.sheet.tall{min-height:70%}
.pickhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ghost.sm{min-height:38px;font-size:14px;padding:0 12px;width:auto!important}
input[type=search],input[type=email]{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:10px 12px;min-height:46px;font-size:16px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.plist li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0;flex-wrap:wrap}
.plist .nm{min-width:0;flex:1 1 160px;font-weight:600;overflow-wrap:anywhere}
.plist .nm small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.plist .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.plist.pick li{padding:0}
.plist.pick li button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;padding:12px 4px;text-align:left;min-height:52px}
.plist.pick li.muted{padding:12px 4px}
.plist.pick .nm{text-align:left}
.chipbtn{border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600;min-height:32px}
.chipbtn.danger{color:var(--fail)}
.chip{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line)}
.chip.f{background:var(--fail-bg);color:var(--fail);border-color:transparent}
.chip.w{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.on{background:var(--info-bg);color:var(--info);border-color:transparent}
.count{display:inline-block;min-width:26px;text-align:center;font-family:var(--f-body);font-size:14px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
.count.bad{background:var(--fail);color:#fff;border-color:var(--fail);outline:0}
.datenav{display:flex;align-items:flex-end;gap:8px}
.datenav .iconbtn{height:46px;min-width:46px;font-size:22px}
.datenav .iconbtn:disabled{opacity:.35}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.stats{grid-template-columns:1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat b{font-family:var(--f-head);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.stat b small{font-size:22px;color:var(--muted)}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--pass)}
.meter.short i{background:var(--fail)}
.statline{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px}
.statline .fbad b{color:var(--fail)}
.tablewrap{overflow-x:auto}
table.hist{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.hist th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
table.hist td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.hist tr[data-date]{cursor:pointer}
table.hist tr.sel td{background:var(--info-bg)}
table.hist td.short{color:var(--fail);font-weight:700}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs button{border:0;background:var(--surface);min-height:46px;font-weight:700}
.tabs button[aria-selected="true"]{background:var(--btn);color:var(--btn-ink)}
.tabs button[aria-selected="true"] .count{background:transparent;color:var(--btn-ink);border-color:var(--btn-ink)}
.cb{display:flex;gap:10px;align-items:center;font-size:15px}
.cb input{width:22px;height:22px}

#gate{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:calc(40px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
#gate .gbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;position:relative}
#gate h2{font-family:var(--f-head);font-size:24px;margin:0}
#gate p{margin:0}
#gate .gbtn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:10px;min-height:50px;font-weight:700;font-size:16px}
#gate .gbtn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
#gate .gl{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
#gate .gl input{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:10px 12px;min-height:46px;font-size:16px;color:var(--ink)}
#gate .gerr{color:var(--fail);font-weight:600}
#gate .glinks{display:flex;justify-content:space-between}
#gate .glink{background:none;border:0;color:var(--ink);text-decoration:underline;padding:6px 0}
#gate .gx{position:absolute;top:12px;right:14px}
.backbtn{display:flex;align-items:center;gap:2px;flex-shrink:0;height:44px;padding:0 12px 0 8px;border-radius:10px;border:1.5px solid var(--ink);background:var(--surface);font-weight:700;font-size:15px}
.backbtn b{font-size:26px;line-height:1;margin-top:-3px}
.formfoot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:400px){.formfoot{grid-template-columns:1fr}}
.ghost.danger{color:var(--fail);border-color:var(--fail)}
.opt{font-weight:400;color:var(--muted);font-size:.85em}
</style>

</head>
<body>
